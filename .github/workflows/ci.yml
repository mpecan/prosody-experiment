# The gates from CLAUDE.md §3. They exist as commands so that "high quality" is a thing the
# repository checks rather than a thing a contributor remembers. A push to main that passes every
# one of them is deployed to prosody.rocks (the `deploy` job, last).
#
# The jobs run the same mise tasks a contributor runs (mise.toml, `mise tasks`), with the tools
# mise.toml pins; each job installs only the tools it names in `install_args`, and a task never
# fetches the rest on its own (the Tauri CLI and the JDK are for building the app on a workstation).
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rust as mise.toml pins it: the same patch release as rust-toolchain.toml.
      - uses: jdx/mise-action@v2
        with:
          version: 2026.6.11
          install_args: rust

      - uses: Swatinem/rust-cache@v2

      # fmt, clippy, test, doc, in CLAUDE.md §3's order, each --locked: invariant I1 promises
      # bit-identical output, and silently resolving a different patch release of a dependency is a
      # way to break that between machines. The accuracy floors in prosody-lts grade against 117k
      # dictionary entries; release mode keeps that under a second. The app is the `app` job's.
      - name: fmt, clippy, test, doc
        run: mise run gates:rust
        env:
          PROSODY_CARGO_SCOPE: --workspace --exclude prosody-app

  # The phone app's shell (src-tauri): apart from the gates because on Linux Tauri links WebKitGTK,
  # which the compiler's crates never need, and installing it would slow every gate run.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: 2026.6.11
          install_args: rust
      - uses: Swatinem/rust-cache@v2
      # WebKitGTK for Tauri; ALSA for cpal, whose Linux backend it is (alsa-sys finds libasound
      # through pkg-config at build time).
      - name: webkit and alsa
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libasound2-dev pkg-config
      - name: clippy
        run: mise run gates:clippy
        env:
          PROSODY_CARGO_SCOPE: -p prosody-app
      - name: test
        run: mise run gates:test
        env:
          PROSODY_CARGO_SCOPE: -p prosody-app

  # The page's browser build: the compiler as WebAssembly must answer every request byte for byte as
  # the native server does (invariant I1 across targets). Separate because it needs node and the
  # wasm target.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rust (with the wasm target and llvm-tools), node, and wasm-bindgen-cli at the Cargo.lock
      # version, all as mise.toml pins them; cargo-binstall fetches wasm-bindgen-cli prebuilt rather
      # than spending ~6m compiling it.
      - uses: jdx/mise-action@v2
        with:
          version: 2026.6.11
          install_args: rust node cargo-binstall cargo:wasm-bindgen-cli
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      # The Rust cache restores `target/`; the site is built from empty, so nothing an older build
      # left behind is tested or deployed with it.
      - name: a clean site
        run: rm -rf target/site
      - name: wasm and native agree
        run: mise run check-wasm
      # check-wasm built the site into target/site; the page is tested end to end on it, with the
      # real compiler, in Chromium.
      - name: cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      # --skip-deps: the site check-wasm just built and checked is the one tested, not a rebuild.
      - name: the page, end to end
        run: mise run --skip-deps e2e
      # The site just checked, byte for byte and in a browser, is the one deployed: kept for the
      # deploy job on a push to main.
      - name: keep the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: target/site
          retention-days: 7
          if-no-files-found: error

  # The page itself (web/): its types, its tests and its build.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: 2026.6.11
          install_args: node
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: install, typecheck, test, build
        run: mise run gates:web

  # The grammar's own corpus tests. Separate from the Rust gates because they need node, and
  # because a grammar regression should be legible as a grammar regression. The committed parser
  # must also match the grammar it claims to come from, or the Rust build and the corpus tests are
  # testing different languages.
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: 2026.6.11
          install_args: node
      - name: corpus tests, generated parser is up to date
        run: mise run grammar

  # A push to main that has passed every job above goes live at https://prosody.rocks, as
  # `./scripts/deploy.sh` would put it there: the worker's redirects checked, then `wrangler deploy`
  # of the site the wasm job built and tested. One deploy at a time, in order; a deploy is never
  # cancelled half way. Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token from the
  # "Edit Cloudflare Workers" template, for the account and the prosody.rocks zone) and
  # CLOUDFLARE_ACCOUNT_ID.
  deploy:
    needs: [gates, wasm, web, grammar]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://prosody.rocks
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: target/site
      - name: every way in reaches https://prosody.rocks
        run: node deploy/check-worker.mjs
      - name: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The version deploys have been made with from mise; pinned so a deploy never changes
          # with a wrangler release.
          wranglerVersion: "4.152.0"
          command: deploy
