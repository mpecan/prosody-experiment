# The gates from CLAUDE.md §3. They exist as commands so that "high quality" is a thing the
# repository checks rather than a thing a contributor remembers. A push to main that passes every
# one of them is deployed to prosody.rocks (the `deploy` job, last).
name: ci

on:
  push:
    branches: [master, main, staging]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the exact patch version; installing from it rather than naming a
      # version here keeps the pin in one place.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # --locked everywhere: invariant I1 promises bit-identical output, and silently resolving a
      # different patch release of a dependency is a way to break that between machines.
      - name: format
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # The accuracy floors in prosody-lts grade against 117k dictionary entries; release mode
      # keeps that under a second.
      - name: test
        run: cargo test --workspace --locked

      - name: docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # The page's browser build: the compiler as WebAssembly must answer every request byte for byte as
  # the native server does (invariant I1 across targets). Separate because it needs node and the
  # wasm target.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
          targets: wasm32-unknown-unknown
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      # The Rust cache restores `target/`; the site is built from empty, so nothing an older build
      # left behind is tested or deployed with it.
      - name: a clean site
        run: rm -rf target/site
      - name: wasm and native agree
        run: ./scripts/check-wasm.sh
      # check-wasm built the site into target/site; the page is tested end to end on it, with the
      # real compiler, in Chromium.
      - name: browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: the page, end to end
        working-directory: web
        run: npm run e2e
      # The site just checked, byte for byte and in a browser, is the one deployed: kept for the
      # deploy job on a push to main or staging.
      - name: keep the site
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: target/site
          retention-days: 7
          if-no-files-found: error

  # The page itself (web/): its types, its tests and its build. Node as mise.toml pins it.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm --prefix web ci
      - name: typecheck, test, build
        run: npm --prefix web run check

  # The grammar's own corpus tests. Separate from the Rust gates because they need node, and
  # because a grammar regression should be legible as a grammar regression.
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: corpus tests
        working-directory: crates/tree-sitter-prosody
        run: npx --yes tree-sitter-cli@0.26.11 test

      # The committed parser must match the grammar it claims to come from, or the Rust build and
      # the corpus tests are testing different languages.
      - name: generated parser is up to date
        working-directory: crates/tree-sitter-prosody
        run: |
          npx --yes tree-sitter-cli@0.26.11 generate
          git diff --exit-code -- src/

  # A push to main that has passed every job above goes live at https://prosody.rocks, as
  # `./scripts/deploy.sh` would put it there: the worker's redirects checked, then `wrangler deploy`
  # of the site the wasm job built and tested. One deploy at a time, in order; a deploy is never
  # cancelled half way. Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token from the
  # "Edit Cloudflare Workers" template, for the account and the prosody.rocks zone) and
  # CLOUDFLARE_ACCOUNT_ID.
  deploy:
    needs: [gates, wasm, web, grammar]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://prosody.rocks
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: target/site
      - name: every way in reaches https://prosody.rocks
        run: node deploy/check-worker.mjs
      - name: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The version deploys have been made with from mise; pinned so a deploy never changes
          # with a wrangler release.
          wranglerVersion: "4.152.0"
          command: deploy

  # A push to staging that has passed every job above goes live at https://staging.prosody.rocks:
  # the worker's redirects checked, then `wrangler deploy --env staging` of the site the wasm job
  # built and tested.
  deploy-staging:
    needs: [gates, wasm, web, grammar]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.prosody.rocks
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: target/site
      - name: every way in reaches https://staging.prosody.rocks
        run: node deploy/check-worker.mjs
      - name: deploy staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.152.0"
          command: deploy --env staging
