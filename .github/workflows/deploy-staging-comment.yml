# Deploys a staging version of the app to https://staging.prosody.rocks when an author or
# collaborator comments on a pull request with "staging", "deploy", or "🚀".
#
# GitHub evaluates issue_comment workflows from the default branch, so this workflow must live on
# main to listen for comments. It checks out the PR branch's head commit, verifies native and Wasm
# parity (scripts/check-wasm.sh), verifies the worker redirects, and deploys with Wrangler.
name: deploy-staging-comment

on:
  issue_comment:
    types: [created]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy-staging-from-comment:
    # Must be on a pull request and by a repo collaborator/owner/member.
    if: |
      github.event.issue.pull_request != null &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.prosody.rocks
    steps:
      - name: check trigger
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const raw = context.payload.comment.body.trim();
            const lower = raw.toLowerCase();
            const triggers = ['staging', 'deploy', '/staging', '/deploy', '🚀'];
            const matchesExact = triggers.includes(lower) || triggers.includes(raw);
            const matchesRocket = raw.includes('🚀');
            const matchesStart = /^(staging|deploy|\/staging|\/deploy)(\s+.*)?$/i.test(lower);

            const matched = matchesExact || matchesRocket || matchesStart;
            if (!matched) {
              core.info(`Comment did not match deploy triggers: "${raw}"`);
              return false;
            }

            try {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'rocket',
              });
            } catch (err) {
              core.warning(`Could not add reaction: ${err.message}`);
            }
            return true;
          result-encoding: string

      - name: get pr details
        if: steps.check.outputs.result == 'true'
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('ref', pr.data.head.ref);

      - name: checkout pr branch
        if: steps.check.outputs.result == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: setup rust
        if: steps.check.outputs.result == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
          targets: wasm32-unknown-unknown
          components: llvm-tools

      - name: rust cache
        if: steps.check.outputs.result == 'true'
        uses: Swatinem/rust-cache@v2

      - name: setup node
        if: steps.check.outputs.result == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Prebuilt wasm-bindgen-cli matching Cargo.lock pinned version (0.2.129); avoids ~6m of compilation.
      - name: prebuilt wasm-bindgen
        if: steps.check.outputs.result == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129

      - name: verify wasm and build site
        if: steps.check.outputs.result == 'true'
        run: |
          rm -rf target/site
          ./scripts/check-wasm.sh
          node deploy/check-worker.mjs

      - name: deploy staging
        if: steps.check.outputs.result == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.152.0"
          command: deploy --env staging

      - name: comment on pr
        if: steps.check.outputs.result == 'true' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.pr.outputs.sha }}';
            const ref = '${{ steps.pr.outputs.ref }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Deployed branch \`${ref}\` (${sha.slice(0, 7)}) to [staging.prosody.rocks](https://staging.prosody.rocks)!`,
            });

      - name: comment failure on pr
        if: steps.check.outputs.result == 'true' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ Staging deployment to [staging.prosody.rocks](https://staging.prosody.rocks) failed. Please check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) logs.`,
            });
