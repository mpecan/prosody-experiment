[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
rand_chacha = "0.10"
rand_core = "0.10"
insta = "1"
proptest = "1"
thiserror = "2"
# `SPEC.md` §5 says the style header is TOML, so the alternative is a hand-rolled subset parser.
# That is the worse option: `Style::parse` promises to ignore keys it does not know so a header
# written for a later version still plays, and that promise only holds if the *whole* document
# parses. A subset parser that mis-reads the rest silently is the failure `CLAUDE.md` §6 forbids.
# Six crates, no proc-macros, no derive — `serde_core` is the runtime-only split, and `toml::Table`
# requires it regardless. `display` and `std` are off; nothing here writes TOML.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tree-sitter = "0.26"
# The page's browser build (`prosody-wasm`): the bindings between the compiler and the page's
# script. The alternative is hand-written exports passing raw pointers, which needs `unsafe` in our
# code and a calling convention kept in step by hand on both sides. Pinned exactly, because the
# `wasm-bindgen` CLI that generates the JavaScript must be the same version
# (`scripts/build-site.sh` installs that version).
wasm-bindgen = "=0.2.129"
tree-sitter-prosody = { path = "crates/tree-sitter-prosody" }
prosody-core = { path = "crates/prosody-core" }
prosody-cmudict = { path = "crates/prosody-cmudict" }
prosody-lexicon = { path = "crates/prosody-lexicon" }
prosody-lts = { path = "crates/prosody-lts" }
prosody-emit = { path = "crates/prosody-emit" }
prosody-score = { path = "crates/prosody-score" }
prosody-web = { path = "crates/prosody-web" }
prosody-wasm = { path = "crates/prosody-wasm" }

# See CLAUDE.md §3. Lints live here, not in per-file `#![allow]`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny" # slicing a poem by index is how you panic on unicode
float_cmp = "deny"
todo = "deny"
dbg_macro = "deny"

# Optimize test builds: opt-level = 1 for workspace crates allows CPU-heavy test suites
# (grading against 117k entries in prosody-lts, full-corpus CLI checks, etc.) to run
# multiple times faster with minimal compilation overhead. External dependencies are
# compiled at opt-level = 2.
[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.prosody-lts]
opt-level = 2
