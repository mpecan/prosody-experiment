[package]
name = "prosody-synth-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# The page's render worker (`docs/player.md` §5): `prosody-player` (the synth and the engine around
# it) built for the browser on its own, so the worker loads a small module rather than the whole
# compiler. A cdylib for the browser (`scripts/build-synth.sh`), and an rlib so its tests run natively.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
prosody-player.workspace = true
prosody-synth.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true
