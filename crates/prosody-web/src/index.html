<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prosody</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14131a; --panel: #1c1b24; --line: #2e2c3a;
    --ink: #e6e3ef; --dim: #918da8; --accent: #c9a6ff; --warn: #ff9b8a;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    padding: .7rem 1rem; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { font-size: 1rem; margin: 0; font-weight: 600; letter-spacing: .02em; }
  h1 span { color: var(--dim); font-weight: 400; }
  button {
    font: inherit; font-weight: 600; padding: .4rem 1rem; border-radius: 6px;
    border: 1px solid var(--line); background: #262433; color: var(--ink); cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #191423; border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; border-color: var(--line); }
  #status { color: var(--dim); font-size: .85rem; margin-left: auto; }
  #status.bad { color: var(--warn); }

  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  section + section { border-left: 1px solid var(--line); }

  #poem {
    flex: 1; resize: none; border: 0; outline: 0; padding: 1rem 1.2rem;
    background: transparent; color: var(--ink);
    font-family: var(--mono); font-size: 14px; line-height: 1.7;
  }

  .palette {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: .8rem 1.2rem; display: grid; gap: .55rem .9rem;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  }
  .palette h2 {
    grid-column: 1 / -1; margin: 0; font-size: .72rem; letter-spacing: .12em;
    text-transform: uppercase; color: var(--dim); font-weight: 600;
  }
  .palette p { grid-column: 1 / -1; margin: 0; color: var(--dim); font-size: .78rem; }
  label { display: flex; flex-direction: column; gap: .2rem; font-size: .74rem; color: var(--dim); }
  select, input {
    font: inherit; font-size: .85rem; padding: .3rem .4rem; border-radius: 5px;
    border: 1px solid var(--line); background: #17161f; color: var(--ink);
  }
  input[type=range] { padding: 0; }
  .row { display: flex; gap: .4rem; }
  .row input { width: 100%; min-width: 0; }

  nav { display: flex; gap: .3rem; padding: .5rem .8rem; border-bottom: 1px solid var(--line); }
  nav button { padding: .25rem .7rem; font-size: .8rem; font-weight: 500; }
  nav button[aria-selected=true] { background: var(--accent); color: #191423; border-color: var(--accent); }
  pre {
    flex: 1; margin: 0; overflow: auto; padding: 1rem 1.2rem;
    font-family: var(--mono); font-size: 12px; line-height: 1.55;
    white-space: pre; tab-size: 2;
  }
  pre.wrapped { white-space: pre-wrap; word-break: break-all; }
  .hidden { display: none; }
</style>
</head>
<body>

<header>
  <h1>prosody <span>— a poem is the score</span></h1>
  <button id="play" class="primary">▶ Play</button>
  <button id="stop" disabled>■ Stop</button>
  <span id="status">ready</span>
</header>

<main>
  <section>
    <textarea id="poem" spellcheck="false" autofocus></textarea>
    <div class="palette">
      <h2>Palette — changes how it sounds, never what happens</h2>
      <label>Scale
        <select id="scale"></select>
      </label>
      <label>Root
        <select id="root"></select>
      </label>
      <label>Bank
        <select id="bank"></select>
      </label>
      <label>Synth
        <select id="synth"></select>
      </label>
      <label>Tempo range (bpm)
        <span class="row">
          <input id="low" type="number" min="1" max="400" value="110">
          <input id="high" type="number" min="1" max="400" value="130">
        </span>
      </label>
      <label>Swing <span id="swingOut">0.00</span>
        <input id="swing" type="range" min="0" max="100" value="0">
      </label>
      <p>
        The poem decides where in the tempo range it sits, from how densely its syllables pack
        into bars. Everything else here is colour.
      </p>
    </div>
  </section>

  <section>
    <nav>
      <button id="tabPattern" aria-selected="true">Pattern</button>
      <button id="tabExplain" aria-selected="false">What each word became</button>
    </nav>
    <pre id="pattern" class="wrapped"></pre>
    <pre id="explain" class="hidden"></pre>
  </section>
</main>

<script src="https://unpkg.com/@strudel/web@1.3.0"></script>
<script>
const $ = (id) => document.getElementById(id);
const controls = ['scale', 'root', 'bank', 'synth', 'low', 'high', 'swing'];

const OPTIONS = {
  scale: __SCALES__,
  root: ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],
  bank: __BANKS__,
  synth: __SYNTHS__,
};
for (const [id, values] of Object.entries(OPTIONS)) {
  $(id).innerHTML = values.map((v) => `<option>${v}</option>`).join('');
}
$('scale').value = 'minor';
$('root').value = 'C';
$('bank').value = 'tr909';
$('synth').value = 'triangle';
$('poem').value = __SEED_POEM__;

let strudelReady = false;
let playing = false;
let latestPattern = '';
let timer = null;

function status(text, bad = false) {
  $('status').textContent = text;
  $('status').classList.toggle('bad', bad);
}

function query() {
  const p = new URLSearchParams();
  for (const id of controls) p.set(id, $(id).value);
  return p.toString();
}

async function compile() {
  $('swingOut').textContent = ($('swing').value / 100).toFixed(2);
  const poem = $('poem').value;
  if (!poem.trim()) {
    latestPattern = '';
    $('pattern').textContent = '';
    $('explain').textContent = '';
    status('nothing to compile');
    return;
  }
  status('compiling…');
  try {
    const [pattern, explain] = await Promise.all([
      fetch('/pattern?' + query(), { method: 'POST', body: poem }),
      fetch('/explain?' + query(), { method: 'POST', body: poem }),
    ]);
    const patternText = await pattern.text();
    $('explain').textContent = await explain.text();
    if (!pattern.ok) {
      $('pattern').textContent = patternText;
      latestPattern = '';
      status(patternText.split('\n')[0], true);
      return;
    }
    $('pattern').textContent = patternText;
    latestPattern = patternText;
    const summary = patternText.split('\n')[1] || '';
    status(summary.replace('// ', '') + (playing ? ' · playing' : ''));
    if (playing) play();          // live reload: keep going with the new version
  } catch (error) {
    status('server unreachable — is `prosody-web` still running?', true);
  }
}

function schedule() {
  clearTimeout(timer);
  timer = setTimeout(compile, 350);
}

async function play() {
  if (!latestPattern) return;
  if (!strudelReady) {
    status('loading Strudel and samples…');
    try {
      await initStrudel();
      strudelReady = true;
    } catch (error) {
      status('could not start Strudel: ' + error.message, true);
      return;
    }
  }
  try {
    // The generated code is a `stack(...)` expression built from Strudel's own functions, which
    // `initStrudel` puts in global scope. Mini-notation inside `s("…")` and `note("…")` is parsed
    // by those functions, so no transpiler step is needed.
    const pattern = (0, eval)(latestPattern);
    pattern.play();
    playing = true;
    $('stop').disabled = false;
    $('play').textContent = '▶ Playing';
    status((latestPattern.split('\n')[1] || '').replace('// ', '') + ' · playing');
  } catch (error) {
    status('Strudel refused the pattern: ' + error.message, true);
  }
}

function stop() {
  if (typeof hush === 'function') hush();
  playing = false;
  $('stop').disabled = true;
  $('play').textContent = '▶ Play';
  status('stopped');
}

$('play').addEventListener('click', play);
$('stop').addEventListener('click', stop);
$('poem').addEventListener('input', schedule);
for (const id of controls) {
  $(id).addEventListener('input', () => {
    if (id === 'swing') $('swingOut').textContent = ($('swing').value / 100).toFixed(2);
    schedule();
  });
}
$('tabPattern').addEventListener('click', () => showTab('pattern'));
$('tabExplain').addEventListener('click', () => showTab('explain'));
function showTab(which) {
  $('pattern').classList.toggle('hidden', which !== 'pattern');
  $('explain').classList.toggle('hidden', which !== 'explain');
  $('tabPattern').setAttribute('aria-selected', which === 'pattern');
  $('tabExplain').setAttribute('aria-selected', which === 'explain');
}

compile();
</script>
</body>
</html>
