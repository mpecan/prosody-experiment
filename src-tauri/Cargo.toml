[package]
name = "prosody-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Prosody — a poem as the source code for music"

[lints]
workspace = true

[lib]
name = "app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", default-features = false , features = [] }

[dependencies]
tauri = { version = "2.11.3", default-features = false, features = ["wry"] }
tauri-plugin-log = "2"
log = "0.4"
